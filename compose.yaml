services:
  frontend:
    build: ./frontend
    image: shop-frontend:1.0
    ports:
      - "8081:80"          # 8081 because Jenkins already uses 8080
    depends_on:
      - backend
    networks:
      - front-net

  backend:
    build: ./backend
    image: shop-backend:1.0
    environment:
      DB_HOST: db
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - front-net
      - back-net

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - back-net

  adminer:
    image: adminer:4
    ports:
      - "8082:8080"        # 8082 on the host, 8080 inside the container
    depends_on:
      db:
        condition: service_healthy
    networks:
      - back-net           # same network as db, so the name "db" resolves

networks:
  front-net:
  back-net:

volumes:
  db-data:
